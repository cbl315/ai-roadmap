[project]
name = "learn-ai-agent"
version = "0.1.0"
description = "AI Agent 开发学习项目 — 从 LLM API 到完整的工作流自动化 Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # LLM SDKs
    "anthropic>=0.42.0",
    "openai>=1.60.0",
    # Type safety & validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # Environment management
    "python-dotenv>=1.0.0",
    # HTTP client
    "httpx>=0.28.0",
    # Rich terminal output (for demo scripts)
    "rich>=13.9.0",
]

[project.optional-dependencies]
# MCP SDK (Module 05)
mcp = [
    "mcp>=1.12.0",
]
# RAG dependencies (Module 07-08)
rag = [
    "chromadb>=0.6.0",
    "tiktoken>=0.8.0",
]
# Orchestration framework comparison (Module 08 only)
langchain = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-chroma>=0.2.0",
]
# Development tools
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
]
# All dependencies
all = [
    "learn-ai-agent[mcp,rag,langchain,dev]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
